<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- スマホでも表示幅が崩れないようにする設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数学用文字練習アプリ</title>

  <!-- フォントを先に読み込み、表示のガタつきを減らす -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Opti:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 見た目（レイアウト・色・ボタンなど）は styles.css にまとめる -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
        <div class="app-header-main">
          <h1>数学用文字練習アプリ</h1>
        </div>
        <section id="app-header-summary" class="app-header-summary" aria-label="ユーザー情報">
        </section>
    </header>

    <!--
      アプリ本体の描画先。
      frontend/pages 配下の Page クラスが、この中身をページごとに入れ替える。
    -->
    <div id="app-root" class="route-host" aria-live="polite"></div>
  </main>

  <!-- フロントエンド処理を責務ごとに分割して読み込む -->
  <script src="frontend/data/charData.js"></script>
  <script src="frontend/utils/common.js"></script>
  <script src="frontend/core/domain.js"></script>
  <script src="frontend/ui/widgets.js"></script>
  <script src="frontend/pages/pages.js"></script>
  <script src="frontend/router/router.js"></script>
  <script src="frontend/app/bootstrap.js"></script>

  <!-- 起動エントリ -->
  <script src="app.js"></script>
</body>
</html>
